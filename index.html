<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Backrooms - Hub & Poolrooms</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #d4af37;
        }
        #start-screen h1 {
            font-size: 3.5rem;
            margin-bottom: 5px;
            text-shadow: 0 0 15px #ffcc00;
            letter-spacing: 3px;
        }
        #start-screen p {
            color: #888;
            margin-bottom: 25px;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        select, #start-btn {
            padding: 14px 28px;
            font-size: 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid #d4af37;
            font-family: 'Courier New', Courier, monospace;
        }
        select {
            background-color: #111;
            color: #d4af37;
        }
        #start-btn {
            background-color: #d4af37;
            color: #000;
            font-weight: bold;
            transition: 0.2s;
        }
        #start-btn:hover {
            background-color: #fff;
            box-shadow: 0 0 15px #d4af37;
        }
        #jumpscare {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(150, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
            font-size: 5rem;
            font-weight: bold;
            text-shadow: 0 0 20px #000;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #ccc;
            font-size: 1rem;
            pointer-events: none;
            text-shadow: 2px 2px 2px #000;
        }
    </style>
</head>
<body>

    <!-- Jumpscare Screen -->
    <div id="jumpscare">YOU DIED</div>

    <!-- Start Screen & Level Selector -->
    <div id="start-screen">
        <h1>THE BACKROOMS</h1>
        <p>Explore the depths. Hold SHIFT to sprint.</p>
        <div class="menu-container">
            <label for="level-select" style="color:#d4af37;">CHOOSE YOUR LEVEL:</label>
            <select id="level-select">
                <option value="0">Level 0: Endless Yellow Labyrinth</option>
                <option value="1">Level 1: The Dark Concrete Warehouse</option>
                <option value="2">Level 37: The Poolrooms (Calm & Tiled)</option>
            </select>
            <button id="start-btn">ENTER THE BACKROOMS</button>
        </div>
    </div>

    <div id="instructions">WASD to Move | HOLD SHIFT to Sprint | Mouse to Look | ESC to Pause</div>

    <!-- Three.js & PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isSprinting = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const walls = [];
        
        let entity;
        let entityActive = false;
        let currentLevel = "0";

        // Procedural Textures Generator
        function createWallTexture(colorHex, patternColorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = colorHex;
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = patternColorHex;
            for(let i=0; i<5000; i++) {
                ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
            }
            ctx.strokeStyle = patternColorHex;
            ctx.lineWidth = 4;
            for(let x=0; x<256; x+=32) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(2, 2);
            return texture;
        }

        function createFloorTexture(colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = colorHex;
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = "#00000033";
            for(let i=0; i<800; i++) {
                ctx.fillRect(Math.random()*256, Math.random()*256, 6, 6);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(10, 10);
            return texture;
        }

        function createPoolTileTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#e0f7fa"; // Pool tile blue-white
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = "#b2ebf2";
            ctx.lineWidth = 3;
            for(let x=0; x<=256; x+=32) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
            }
            for(let y=0; y<=256; y+=32) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 4);
            return texture;
        }

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);

            const startScreen = document.getElementById('start-screen');
            const startBtn = document.getElementById('start-btn');
            const levelSelect = document.getElementById('level-select');

            buildLevel("0");

            startBtn.addEventListener('click', () => {
                currentLevel = levelSelect.value;
                buildLevel(currentLevel);
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                startScreen.style.display = 'none';
                entityActive = true;
            });

            controls.addEventListener('unlock', () => {
                startScreen.style.display = 'flex';
                entityActive = false;
            });

            scene.add(controls.getObject());

            // Controls listeners with Shift to Sprint
            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveForward = true;
                if (e.code === 'KeyA') moveLeft = true;
                if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyD') moveRight = true;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') isSprinting = true;
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveForward = false;
                if (e.code === 'KeyA') moveLeft = false;
                if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyD') moveRight = false;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') isSprinting = false;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function buildLevel(levelId) {
            walls.length = 0;
            scene.children.forEach(child => {
                if (child !== camera && child !== controls.getObject() && child.type !== 'AmbientLight' && child.type !== 'PointLight') {
                    scene.remove(child);
                }
            });

            let wallMat, floorMat, ceilMat, fogColor;

            if (levelId === "0") {
                fogColor = 0xd4af37;
                scene.background = new THREE.Color(fogColor);
                scene.fog = new THREE.FogExp2(fogColor, 0.025);
                wallMat = new THREE.MeshBasicMaterial({ map: createWallTexture("#d9b336", "#a68212") });
                floorMat = new THREE.MeshBasicMaterial({ map: createFloorTexture("#967d28") });
                ceilMat = new THREE.MeshBasicMaterial({ color: 0x332b11 });
            } else if (levelId === "1") {
                fogColor = 0x1f1f1f;
                scene.background = new THREE.Color(fogColor);
                scene.fog = new THREE.FogExp2(fogColor, 0.035);
                wallMat = new THREE.MeshBasicMaterial({ map: createWallTexture("#4d4d4d", "#262626") });
                floorMat = new THREE.MeshBasicMaterial({ map: createFloorTexture("#1a1a1a") });
                ceilMat = new THREE.MeshBasicMaterial({ color: 0x0a0a0a });
            } else if (levelId === "2") {
                // LEVEL 37: THE POOLROOMS
                fogColor = 0x80deea;
                scene.background = new THREE.Color(fogColor);
                scene.fog = new THREE.FogExp2(fogColor, 0.02);
                wallMat = new THREE.MeshBasicMaterial({ map: createPoolTileTexture() });
                floorMat = new THREE.MeshBasicMaterial({ map: createPoolTileTexture() });
                ceilMat = new THREE.MeshBasicMaterial({ color: 0xb2ebf2 });
            }

            // Environment Floor & Ceiling
            const size = 120;
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(size, size), floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(size, size), ceilMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 5;
            scene.add(ceiling);

            // Lighting
            const ambientLightColor = levelId === "2" ? 0xe0f7fa : 0xfffaed;
            const ambient = new THREE.AmbientLight(ambientLightColor, 0.7);
            scene.add(ambient);

            for(let x = -40; x <= 40; x += 20) {
                for(let z = -40; z <= 40; z += 20) {
                    const pLight = new THREE.PointLight(levelId === "2" ? 0x80cbc4 : 0xffebaf, 0.8, 25);
                    pLight.position.set(x, 4.5, z);
                    scene.add(pLight);
                }
            }

            // Maze generation helper
            function addWall(x, z, w, d) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 5, d), wallMat);
                mesh.position.set(x, 2.5, z);
                scene.add(mesh);
                walls.push(new THREE.Box3().setFromObject(mesh));
            }

            const b = size / 2;
            addWall(0, -b, size, 2);
            addWall(0, b, size, 2);
            addWall(-b, 0, 2, size);
            addWall(b, 0, 2, size);

            for (let x = -45; x <= 45; x += 15) {
                for (let z = -45; z <= 45; z += 15) {
                    if (Math.random() > 0.3 && (x !== 0 || z !== 0)) {
                        if (Math.random() > 0.5) {
                            addWall(x, z, 12, 2);
                        } else {
                            addWall(x, z, 2, 12);
                        }
                    }
                }
            }

            // Entity configuration depending on level
            const entityGroup = new THREE.Group();
            
            if (levelId === "2") {
                // Poolrooms Entity: Slow, cyan-glowing watcher creature
                const bodyMat = new THREE.MeshBasicMaterial({ color: 0x004d40 });
                const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 2.5, 8), bodyMat);
                torso.position.y = 1.25;
                entityGroup.add(torso);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00bcd4 }));
                head.position.y = 2.8;
                entityGroup.add(head);
            } else {
                // Bacteria / Warehouse Entity
                const bodyMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
                const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3.5, 0.6), bodyMat);
                torso.position.y = 2;
                entityGroup.add(torso);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), bodyMat);
                head.position.y = 4.0;
                entityGroup.add(head);
            }

            entityGroup.position.set(20, 0, -20);
            scene.add(entityGroup);
            entity = entityGroup;
        }

        function checkCollision(position) {
            const pBox = new THREE.Box3(
                new THREE.Vector3(position.x - 0.4, position.y - 1.5, position.z - 0.4),
                new THREE.Vector3(position.x + 0.4, position.y + 0.5, position.z + 0.4)
            );
            for (let w of walls) {
                if (pBox.intersectsBox(w)) return true;
            }
            return false;
        }

        function triggerJumpscare() {
            entityActive = false;
            controls.unlock();
            document.getElementById('jumpscare').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('jumpscare').style.display = 'none';
                camera.position.set(0, 1.6, 0);
                entity.position.set(20, 0, -20);
            }, 2000);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                // Dynamic speed modifier if sprinting
                const moveSpeed = isSprinting ? 80.0 : 45.0;

                if (moveForward || moveBackward) velocity.z -= direction.z * moveSpeed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * moveSpeed * delta;

                const oldPos = controls.getObject().position.clone();
                controls.moveRight(-velocity.x * delta);
                if (checkCollision(controls.getObject().position)) controls.getObject().position.x = oldPos.x;

                controls.moveForward(-velocity.z * delta);
                if (checkCollision(controls.getObject().position)) controls.getObject().position.z = oldPos.z;

                // Entity Movement Logic
                if (entity && entityActive) {
                    const playerPos = controls.getObject().position;
                    const entityPos = entity.position;

                    // Poolrooms entity moves much slower and less aggressively than Level 0/1 entities
                    const entitySpeed = (currentLevel === "2") ? 1.5 * delta : 3.5 * delta;

                    const dirX = playerPos.x - entityPos.x;
                    const dirZ = playerPos.z - entityPos.z;
                    const dist = Math.sqrt(dirX * dirX + dirZ * dirZ);

                    if (dist > 1.0) {
                        entityPos.x += (dirX / dist) * entitySpeed;
                        entityPos.z += (dirZ / dist) * entitySpeed;
                        entity.lookAt(playerPos.x, playerPos.y, playerPos.z);
                    } else {
                        triggerJumpscare();
                    }
                }

                prevTime = time;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
