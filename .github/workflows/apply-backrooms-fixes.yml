name: Apply Backrooms fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Remastered JavaScript
        run: |
          node --check remastered_upgrade.js
          node --check remastered_gameplay.js
          node --check profile_upgrade.js
          node --check profile_hotfix.js
          node --check voice_chat.js
          node --check remastered_horror.js
          node --check remastered_ui_system.js
          node --check living_world_upgrade.js
          node --check character_system.js
          node --check visual_remodel.js
          node --check level0_remodel.js
          node --check level_remodel_pack.js
          node --check level_architecture_remodel.js
          node --check level_menu_hotfix.js
          node --check stability_hotfix.js
      - name: Ensure gameplay, UI and SEO enhancements are loaded
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          body_marker = '</body>'
          head_marker = '</head>'
          if body_marker not in s or head_marker not in s:
              raise SystemExit('index.html is missing required HTML markers')

          tags = [
              '    <script src="./backrooms_fixes.js"></script>',
              '    <script src="./realism_upgrade.js"></script>',
              '    <script src="./level_expansion.js"></script>',
              '    <script src="./performance_upgrade.js"></script>',
              '    <script src="./remastered_upgrade.js"></script>',
              '    <script src="./remastered_gameplay.js"></script>',
              '    <script src="./profile_upgrade.js"></script>',
              '    <script src="./profile_hotfix.js"></script>',
              '    <script src="./voice_chat.js"></script>',
              '    <script src="./remastered_horror.js"></script>',
              '    <script src="./remastered_ui_system.js"></script>',
              '    <script src="./living_world_upgrade.js"></script>',
              '    <script src="./character_system.js"></script>',
              '    <script src="./visual_remodel.js"></script>',
              '    <script src="./level0_remodel.js"></script>',
              '    <script src="./level_remodel_pack.js"></script>',
              '    <script src="./level_architecture_remodel.js"></script>',
              '    <script src="./level_menu_hotfix.js"></script>',
              '    <script src="./stability_hotfix.js"></script>'
          ]
          insert = '\n'.join(t for t in tags if t not in s)
          if insert:
              s = s.replace(body_marker, insert + '\n' + body_marker, 1)

          seo_tags = [
              '    <meta name="description" content="Play a free Backrooms game online. Explore Level 0, Poolrooms, multiplayer survival, mysterious levels, items, and unsettling environments.">',
              '    <meta name="keywords" content="Backrooms, Backrooms game, play Backrooms, Level 0, Poolrooms, Backrooms multiplayer, Backrooms online game">',
              '    <meta name="robots" content="index, follow">',
              '    <meta property="og:title" content="The Backrooms — Play the Free Online Game">',
              '    <meta property="og:description" content="Explore the Backrooms online with multiplayer survival, Level 0, Poolrooms, mysterious levels, tasks, items, and more.">',
              '    <meta property="og:type" content="website">'
          ]
          if '<meta name="description"' not in s:
              s = s.replace(head_marker, '\n'.join(seo_tags) + '\n' + head_marker, 1)

          old_title = '<title>The Backrooms - Multiplayer</title>'
          new_title = '<title>The Backrooms Game — Play Level 0, Poolrooms & More Online</title>'
          if old_title in s:
              s = s.replace(old_title, new_title, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load stability and level selection hotfix'
          git push
