name: Apply Backrooms fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gameplay upgrade scripts are loaded
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          if marker not in s:
              raise SystemExit('index.html has no </body> marker')
          tags = [
              '    <script src="./backrooms_fixes.js"></script>',
              '    <script src="./realism_upgrade.js"></script>',
              '    <script src="./level_expansion.js"></script>'
          ]
          insert = '\n'.join(t for t in tags if t not in s) + '\n'
          if insert.strip():
              s = s.replace(marker, insert + marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load Backrooms level expansion'
          git push
