name: Apply Backrooms fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gameplay and SEO enhancements are loaded
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          head_marker = '</head>'
          if marker not in s or head_marker not in s:
              raise SystemExit('index.html is missing required HTML markers')

          tags = [
              '    <script src="./backrooms_fixes.js"></script>',
              '    <script src="./realism_upgrade.js"></script>',
              '    <script src="./level_expansion.js"></script>',
              '    <script src="./performance_upgrade.js"></script>'
          ]
          insert = '\n'.join(t for t in tags if t not in s) + '\n'
          if insert.strip():
              s = s.replace(marker, insert + marker, 1)

          seo = '''    <meta name="description" content="Play a free Backrooms game online. Explore Level 0, Poolrooms, multiplayer survival, mysterious levels, tasks, items, and unsettling environments.">
    <meta name="keywords" content="Backrooms, Backrooms game, play Backrooms, Level 0, Poolrooms, Backrooms multiplayer, Backrooms online game">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="The Backrooms — Play the Free Online Game">
    <meta property="og:description" content="Explore the Backrooms online with multiplayer survival, Level 0, Poolrooms, mysterious levels, tasks, and more.">
    <meta property="og:type" content="website">
'''
          if '<meta name="description"' not in s:
              s = s.replace(head_marker, seo + head_marker, 1)

          s = s.replace('<title>The Backrooms - Multiplayer</title>', '<title>The Backrooms Game — Play Level 0, Poolrooms & More Online</title>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Improve Backrooms search metadata'
          git push
